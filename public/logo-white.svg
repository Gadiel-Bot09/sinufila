<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="SinuFila - Sistema de Turnos">
  <defs>
    <!-- Sombra suave para el icono -->
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="white" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- ═══ ÍCONO — versión blanca (para fondos oscuros) ═══ -->
  <!-- Caja: borde blanco translúcido, fondo blanco muy suave -->
  <rect x="1" y="1" width="62" height="62" rx="13"
        fill="rgba(255,255,255,0.12)"
        stroke="rgba(255,255,255,0.55)"
        stroke-width="1.5"
        filter="url(#sf-glow)"/>

  <!-- Fila 1 — turno activo -->
  <circle cx="16" cy="22" r="6.5" fill="white"/>
  <polyline points="12.5,22 15,24.5 19.5,19"
            fill="none" stroke="rgba(78,203,212,1)"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="26" y="17" width="30" height="10" rx="5" fill="white" opacity="0.95"/>
  <polygon points="58,19.5 62,22 58,24.5" fill="rgba(78,203,212,0.9)"/>

  <!-- Fila 2 -->
  <circle cx="16" cy="38" r="6.5" fill="white" opacity="0.72"/>
  <rect x="26" y="33" width="22" height="10" rx="5" fill="white" opacity="0.60"/>

  <!-- Fila 3 -->
  <circle cx="16" cy="54" r="6.5" fill="white" opacity="0.45"/>
  <rect x="26" y="49" width="14" height="10" rx="5" fill="white" opacity="0.38"/>

  <!-- ═══ WORDMARK blanco ═══ -->
  <text x="80" y="36"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="34" font-weight="300" letter-spacing="-0.5"
    fill="white">Sinu</text>

  <text x="162" y="36"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="34" font-weight="800" letter-spacing="-0.5"
    fill="rgba(78,203,212,1)">Fila</text>

  <!-- Separador punto -->
  <circle cx="84" cy="47" r="2" fill="rgba(255,255,255,0.45)"/>

  <!-- Tagline -->
  <text x="92" y="51"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="9.5" font-weight="500" letter-spacing="2.5"
    fill="rgba(255,255,255,0.45)">SISTEMA DE TURNOS</text>
</svg>
